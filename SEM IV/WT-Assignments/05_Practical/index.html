<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Aditya Pawar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #0f2027;  
            background: linear-gradient(to right, #2c5364, #203a43, #0f2027);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .input-group label {
            margin-bottom: 6px;
            font-size: 14px;
            color: #ccc;
        }

        .input-group input,
        .input-group textarea {
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            resize: none;
        }

        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #00adb5;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #007b83;
        }

        #responseMessage {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h2>Get in Touch</h2>
        <form id="contactForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required />
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required />
            </div>
            <div class="input-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" placeholder="Write something..." rows="4" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
            <p id="responseMessage"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById("contactForm");
        const responseMessage = document.getElementById("responseMessage");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                message: document.getElementById("message").value,
            };

            try {
                const response = await fetch("/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData),
                });

                const data = await response.json();
                responseMessage.textContent = data.message;
                responseMessage.style.color = "lightgreen";
                form.reset();
            } catch (error) {
                console.error("Error:", error);
                responseMessage.textContent = "Oops! Something went wrong.";
                responseMessage.style.color = "red";
            }
        });
    </script>

</body>
</html>
